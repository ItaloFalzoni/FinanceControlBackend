name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: financecontrol
          POSTGRES_USER: financecontrol
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U financecontrol -d financecontrol"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_TEST_ADMIN_CONNECTION: Host=localhost;Port=5432;Username=financecontrol;Password=ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build FinanceControl.sln --nologo
      - run: dotnet test --no-build --collect:"XPlat Code Coverage" --nologo
